<footer class="site-footer">
    <div class="site-footer__inner">
        <p class="site-footer__name">{{ .Site.Title }}</p>
        <ul class="site-footer__links">
            <li><a href="mailto:{{ hugo.Data.profile.email }}">Email</a></li>
            <li><a href="{{ hugo.Data.profile.cv }}" download>CV</a></li>
            <li><a href="{{ hugo.Data.profile.scholar }}">Google Scholar</a></li>
            <li><a href="https://github.com/semink">GitHub</a></li>
        </ul>
        <p class="site-footer__legal">&copy; {{ now.Year }} {{ .Site.Title }}</p>
    </div>
</footer>
