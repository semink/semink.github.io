<section class="section section--dark contact">
    <div class="container">
        <h2 class="section__title">Get in Touch</h2>
        <p class="contact__lead">I&rsquo;m always happy to discuss research, collaborate on interesting problems, or chat about machine learning and signal processing.</p>
        <div class="hero__actions">
            <a class="btn btn--primary" href="mailto:{{ hugo.Data.profile.email }}">Email</a>
            <a class="btn btn--secondary-dark" href="{{ hugo.Data.profile.cv }}" download>CV</a>
            <a class="btn btn--secondary-dark" href="{{ hugo.Data.profile.scholar }}" target="_blank" rel="noopener noreferrer">Google Scholar</a>
        </div>
    </div>
</section>
